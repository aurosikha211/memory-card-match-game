
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101d40">
  <title>Memory Match Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game-container">
    <header class="game-header">
      <p class="eyebrow">TRAIN YOUR BRAIN</p>
      <h1>Memory <span>Match</span></h1>
      <p class="subtitle">Remember the cards and find every matching pair!</p>
    </header>

    <section class="stats" aria-label="Game statistics">
      <div class="stat-card">
        <span class="stat-icon">⟳</span>
        <div><p class="stat-label">Moves</p><p class="stat-value" id="moves">0</p></div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">◷</span>
        <div><p class="stat-label">Time</p><p class="stat-value" id="timer">00:00</p></div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">🏆</span>
        <div><p class="stat-label">Best</p><p class="stat-value" id="best-score">--</p></div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">🪙</span>
        <div><p class="stat-label">Coins</p><p class="stat-value" id="coins">30</p></div>
      </div>
    </section>

    <section class="game-panel">
      <div class="level-row">
        <span class="level-pill">LEVEL <strong id="level">1</strong> / 50</span>
        <span class="pairs-label" id="pairs-label">8 pairs</span>
      </div>

      <p class="status-message" id="message" role="status" aria-live="polite">
        Memorize the cards!
      </p>

      <div class="progress-info">
        <span>Matched pairs</span>
        <span id="progress">0 / 8</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="game-board" id="game-board" aria-label="Memory card board"></div>
    </section>

    <footer class="game-actions">
      <button class="action-button reveal-button" id="reveal" type="button">
        Reveal · 10 🪙
      </button>
      <button class="action-button restart-button" id="restart" type="button">
        ↻ Restart Game
      </button>
      <span class="footer-note">Good luck! 🍀</span>
    </footer>
  </main>
</body>
</html>

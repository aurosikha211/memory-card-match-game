<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play a fun memory card matching game and test your memory.">
  <title>Memory Match | Brain Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game-container">
    <header class="game-header">
      <p class="eyebrow">BRAIN TRAINING</p>
      <h1>Memory Match</h1>
      <p class="subtitle">Find all 8 matching pairs!</p>
    </header>

    <section class="stats" aria-label="Game statistics">
      <div class="stat-box">
        <span class="stat-label">MOVES</span>
        <span class="stat-value" id="moves">0</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">TIME</span>
        <span class="stat-value" id="timer">00:00</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">MATCHED</span>
        <span class="stat-value" id="matched">0 / 8</span>
      </div>
    </section>

    <div class="best-score">
      🏆 Best score: <span id="best-score">Not set</span>
    </div>

    <section
      class="card-grid"
      id="card-grid"
      aria-label="Memory cards"
    ></section>

    <p
      class="game-message"
      id="game-message"
      role="status"
      aria-live="polite"
    >
      Tap a card to reveal it!
    </p>

    <button class="restart-button" id="restart-button" type="button">
      ↻ Restart Game
    </button>

    <footer>
      Built with HTML, CSS &amp; JavaScript
    </footer>
  </main>
</body>
</html>
